<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Professores | ADN Ensinar Gestão</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h1>Professores</h1>
      <div class="toolbar">
        <select class="select" id="ordem" aria-label="Ordenar">
          <option value="" hidden>Ordenar…</option>
          <option value="nome:asc">Nome (A–Z)</option>
          <option value="nome:desc">Nome (Z–A)</option>
          <option value="recente:desc">Mais recentes</option>
          <option value="recente:asc">Mais antigos</option>
        </select>
        <button class="btn" id="novo">+ Novo professor</button>
      </div>
    </div>

    <div class="card table-wrap">
      <table class="table">
        <thead>
          <tr><th data-sort="nome">Nome</th><th data-sort="disc">Disciplinas lecionadas</th><th data-sort="email">Email</th><th data-sort="tel">Telefone</th><th data-sort="estado" data-dir="desc">Estado</th></tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
      <div class="empty" id="vazio" hidden>Ainda não há professores. Adiciona o primeiro para os poderes usar no horário.</div>
    </div>
  </main>

  <dialog class="modal" id="modal">
    <form id="form" method="dialog" novalidate>
      <div class="modal__head">
        <h2 id="modal-title">Novo professor</h2>
        <button type="button" class="modal__close" data-close aria-label="Fechar">×</button>
      </div>
      <div class="modal__body">
        <div class="form-grid">
          <div class="field span-2">
            <label for="f-nome">Nome *</label>
            <input class="input" id="f-nome" name="nome" required />
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input class="input" id="f-email" name="email" type="email" />
          </div>
          <div class="field">
            <label for="f-tel">Telefone</label>
            <input class="input" id="f-tel" name="telefone" type="tel" />
          </div>
          <div class="field span-2">
            <label>Disciplinas lecionadas</label>
            <div class="chips" id="f-disc"></div>
          </div>
          <div class="field span-2">
            <label>Cor no horário</label>
            <div class="swatches" id="swatches"></div>
          </div>
          <label class="check span-2">
            <input type="checkbox" name="ativo" checked /> Professor ativo
          </label>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--danger" id="apagar" hidden>Apagar</button>
        <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
        <button type="submit" class="btn" id="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { sb, requireAuth, esc, toast, failed, formData, fillForm, wireModal, CORES, ordenar, ligarOrdenacao, sincronizar } from "./js/app.js";

    await requireAuth();

    const $ = (id) => document.getElementById(id);
    const modal = $("modal");
    const form = $("form");
    wireModal(modal);

    $("swatches").innerHTML = CORES.map(
      (c, i) => `<label title="${c}"><input type="radio" name="cor" value="${c}" ${i === 0 ? "checked" : ""} /><i style="background:${c}"></i></label>`
    ).join("");

    let profs = [];
    let disciplinas = [];
    let discPorProf = new Map(); // professor_id → Set(disciplina_id)
    let editId = null;

    const nomesDisc = (id) =>
      disciplinas.filter((d) => discPorProf.get(id)?.has(d.id)).map((d) => d.nome).join(", ");

    const estadoOrdem = { chave: "nome", dir: "asc" };
    const CHAVES = {
      nome: (p) => p.nome,
      disc: (p) => nomesDisc(p.id),
      email: (p) => p.email,
      tel: (p) => p.telefone,
      estado: (p) => p.ativo,
      recente: (p) => p.created_at,
    };

    async function carregar() {
      const [r1, r2, r3] = await Promise.all([
        sb.from("professores").select("*"),
        sb.from("disciplinas").select("*").order("ordem").order("nome"),
        sb.from("professor_disciplinas").select("professor_id, disciplina_id"),
      ]);
      if (failed(r1.error, "Erro a carregar professores") || failed(r2.error, "Erro a carregar disciplinas") || failed(r3.error, "Erro a carregar disciplinas dos professores")) return;
      profs = r1.data;
      disciplinas = r2.data;
      discPorProf = new Map();
      for (const r of r3.data) {
        if (!discPorProf.has(r.professor_id)) discPorProf.set(r.professor_id, new Set());
        discPorProf.get(r.professor_id).add(r.disciplina_id);
      }
      render();
    }

    function render() {
      const vazio = '<span class="muted">—</span>';
      $("vazio").hidden = profs.length > 0;
      $("lista").innerHTML = ordenar(profs, estadoOrdem, CHAVES).map((p) => `
        <tr data-id="${p.id}">
          <td><span class="dot" style="background:${esc(p.cor)}"></span><strong>${esc(p.nome)}</strong></td>
          <td class="small">${esc(nomesDisc(p.id)) || vazio}</td>
          <td>${esc(p.email) || vazio}</td>
          <td>${esc(p.telefone) || vazio}</td>
          <td>${p.ativo ? '<span class="badge badge--green">Ativo</span>' : '<span class="badge badge--off">Inativo</span>'}</td>
        </tr>`).join("");
    }

    function abrir(p = null) {
      editId = p?.id ?? null;
      form.reset();
      fillForm(form, p ?? { ativo: true, cor: CORES[profs.length % CORES.length] });
      const escolhidas = discPorProf.get(p?.id) ?? new Set();
      $("f-disc").innerHTML = disciplinas
        .filter((d) => d.ativo || escolhidas.has(d.id))
        .map((d) => `<label class="chip"><input type="checkbox" data-multi="1" value="${d.id}" ${escolhidas.has(d.id) ? "checked" : ""} /><span>${esc(d.nome)}</span></label>`)
        .join("") || '<span class="muted small">Sem disciplinas — cria-as em Configuração → Disciplinas.</span>';
      $("modal-title").textContent = p ? "Editar professor" : "Novo professor";
      $("apagar").hidden = !p;
      modal.showModal();
      $("f-nome").focus();
    }

    $("lista").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (tr) abrir(profs.find((p) => p.id === tr.dataset.id));
    });
    $("novo").addEventListener("click", () => abrir());
    ligarOrdenacao(document.querySelector("table.table"), $("ordem"), estadoOrdem, render);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const dados = formData(form);
      if (!dados.nome) return toast("O nome é obrigatório.", true);
      const discIds = [...$("f-disc").querySelectorAll("input:checked")].map((i) => i.value);
      $("guardar").disabled = true;
      try {
        let id = editId;
        if (id) {
          const { error } = await sb.from("professores").update(dados).eq("id", id);
          if (failed(error, "Não foi possível guardar")) return;
        } else {
          const { data, error } = await sb.from("professores").insert(dados).select("id").single();
          if (failed(error, "Não foi possível guardar")) return;
          id = data.id;
        }
        const e3 = await sincronizar("professor_disciplinas", "professor_id", id, "disciplina_id", discIds);
        if (failed(e3, "O professor foi guardado, mas houve um erro nas disciplinas")) return;
        modal.close();
        toast("Guardado.");
        carregar();
      } finally {
        $("guardar").disabled = false;
      }
    });

    $("apagar").addEventListener("click", async () => {
      const p = profs.find((x) => x.id === editId);
      if (!confirm(`Apagar "${p.nome}"?\n\nAs aulas dele no horário ficam sem professor. Se apenas deixou de dar aulas, desmarca "Professor ativo".`)) return;
      const { error } = await sb.from("professores").delete().eq("id", editId);
      if (failed(error, "Não foi possível apagar")) return;
      modal.close();
      toast("Professor apagado.");
      carregar();
    });

    carregar();
  </script>
</body>
</html>
