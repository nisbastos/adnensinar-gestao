<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mensalidades | ADN Ensinar Gestão</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h1>Mensalidades</h1>
      <div class="month-nav" role="group" aria-label="Mês">
        <button type="button" class="btn btn--ghost btn--sm" id="mes-ant" aria-label="Mês anterior">‹</button>
        <input class="input" type="month" id="mes" />
        <button type="button" class="btn btn--ghost btn--sm" id="mes-seg" aria-label="Mês seguinte">›</button>
      </div>
    </div>

    <section class="stats" id="stats"></section>

    <div class="toolbar toolbar--spread">
      <div class="toolbar">
        <input class="input search" id="search" type="search" placeholder="Pesquisar aluno…" />
        <select class="select" id="filter-estado" aria-label="Estado">
          <option value="">Todos os estados</option>
          <option value="Por pagar">Por pagar</option>
          <option value="Em atraso">Em atraso</option>
          <option value="Parcial">Parcial</option>
          <option value="Pago">Pago</option>
          <option value="Isento">Isento</option>
        </select>
        <select class="select" id="ordem" aria-label="Ordenar">
          <option value="" hidden>Ordenar…</option>
          <option value="aluno:asc">Aluno (A–Z)</option>
          <option value="aluno:desc">Aluno (Z–A)</option>
          <option value="total:desc">Total (maior)</option>
          <option value="pago:desc">Pagamento mais recente</option>
        </select>
      </div>
      <button class="btn" id="gerar">Gerar mensalidades do mês</button>
    </div>

    <p class="small muted" id="aviso"></p>

    <div class="card table-wrap">
      <table class="table table--compact">
        <thead>
          <tr>
            <th data-sort="aluno">Aluno</th>
            <th data-sort="plano">Plano</th>
            <th data-sort="mensalidade" data-dir="desc" class="num">Mensalidade</th>
            <th data-sort="duodecimo" data-dir="desc" class="num">Duodécimo</th>
            <th data-sort="inscricao" data-dir="desc" class="num">Inscrição</th>
            <th data-sort="total" data-dir="desc" class="num">Total</th>
            <th data-sort="estado">Estado</th>
            <th data-sort="pago" data-dir="desc">Pago em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
        <tfoot id="totais"></tfoot>
      </table>
      <div class="empty" id="vazio" hidden></div>
    </div>
  </main>

  <dialog class="modal" id="modal">
    <form id="form" method="dialog" novalidate>
      <div class="modal__head">
        <h2 id="modal-title">Mensalidade</h2>
        <button type="button" class="modal__close" data-close aria-label="Fechar">×</button>
      </div>
      <div class="modal__body">
        <p class="muted small" id="modal-sub" style="margin-top:0"></p>
        <div class="form-grid">
          <div class="field">
            <label for="f-mens">Mensalidade (€)</label>
            <input class="input" id="f-mens" name="mensalidade" type="number" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="f-duo">Duodécimo (€)</label>
            <input class="input" id="f-duo" name="duodecimo" type="number" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="f-insc">Inscrição (€)</label>
            <input class="input" id="f-insc" name="inscricao" type="number" min="0" step="0.01" />
          </div>
          <div class="field">
            <label>Total</label>
            <div class="total-box" id="f-total"></div>
          </div>

          <h3 class="form-section span-2">Pagamento</h3>
          <div class="field">
            <label for="f-estado">Estado</label>
            <select class="select" id="f-estado" name="estado">
              <option>Por pagar</option>
              <option>Pago</option>
              <option>Parcial</option>
              <option>Isento</option>
            </select>
          </div>
          <div class="field" id="campo-pago">
            <label for="f-vpago">Valor pago (€)</label>
            <input class="input" id="f-vpago" name="valor_pago" type="number" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="f-data">Pago em</label>
            <input class="input" id="f-data" name="pago_em" type="date" />
          </div>
          <div class="field">
            <label for="f-metodo">Método</label>
            <select class="select" id="f-metodo" name="metodo">
              <option value="">—</option>
              <option>Transferência</option>
              <option>MB Way</option>
              <option>Multibanco</option>
              <option>Numerário</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="field span-2">
            <label for="f-notas">Notas</label>
            <textarea class="textarea" id="f-notas" name="notas"></textarea>
          </div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--danger" id="apagar">Apagar</button>
        <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
        <button type="submit" class="btn" id="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/mensalidades.js"></script>
</body>
</html>
