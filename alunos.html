<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Alunos | ADN Ensinar Gestão</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main class="page">
    <div class="page-head">
      <h1>Alunos</h1>
      <div class="toolbar">
        <input class="input search" id="search" type="search" placeholder="Pesquisar nome, escola, NIF, encarregado…" />
        <select class="select" id="ordem" aria-label="Ordenar">
          <option value="" hidden>Ordenar…</option>
          <option value="nome:asc">Nome (A–Z)</option>
          <option value="nome:desc">Nome (Z–A)</option>
          <option value="recente:desc">Inscrição mais recente</option>
          <option value="recente:asc">Inscrição mais antiga</option>
          <option value="ano:asc">Ano escolar</option>
        </select>
        <select class="select" id="filter-estado">
          <option value="ativos">Ativos</option>
          <option value="inativos">Inativos</option>
          <option value="todos">Todos</option>
        </select>
        <a class="btn btn--ghost so-admin" href="importar.html">Importar CSV</a>
        <button class="btn" id="novo">+ Novo aluno</button>
      </div>
    </div>

    <p class="muted small" id="contagem"></p>

    <div class="card table-wrap">
      <table class="table table--compact">
        <thead>
          <tr>
            <th data-sort="nome">Nome</th>
            <th data-sort="ano">Ano</th>
            <th data-sort="tel">Contacto do aluno</th>
            <th data-sort="ee">Encarregado de educação</th>
            <th data-sort="eetel">Contacto do EE</th>
            <th data-sort="einst">Email inst.</th>
            <th>Password inst. <button type="button" class="link-btn" id="pw-todas">ver todas</button></th>
            <th data-sort="saida" data-dir="desc" title="Autoriza a saída das instalações">Pode sair</th>
          </tr>
        </thead>
        <tbody id="lista"></tbody>
      </table>
      <div class="empty" id="vazio" hidden>Ainda não há alunos aqui.</div>
    </div>
  </main>

  <dialog class="modal modal--wide" id="modal">
    <form id="form" method="dialog" novalidate>
      <div class="modal__head">
        <h2 id="modal-title">Novo aluno</h2>
        <button type="button" class="modal__close" data-close aria-label="Fechar">×</button>
      </div>
      <div class="modal__body">
        <div class="form-grid">
          <h3 class="form-section span-2">Aluno</h3>
          <div class="field span-2">
            <label for="f-nome">Nome completo *</label>
            <input class="input" id="f-nome" name="nome" required />
          </div>
          <div class="field">
            <label for="f-comum" title="Como tratamos o aluno no dia a dia. Usado com o apelido em todo o site (horário, Hoje, mensalidades).">Nome comum</label>
            <input class="input" id="f-comum" name="nome_comum" placeholder="ex.: André" />
          </div>
          <div class="field">
            <label>Aparece como</label>
            <div class="total-box" id="f-mostra">—</div>
          </div>
          <div class="field">
            <label for="f-nasc">Data de nascimento</label>
            <input class="input" id="f-nasc" name="data_nascimento" type="date" />
          </div>
          <div class="field">
            <label for="f-nif">NIF</label>
            <input class="input" id="f-nif" name="nif" inputmode="numeric" />
          </div>
          <div class="field">
            <label for="f-telal">Telemóvel do aluno</label>
            <input class="input" id="f-telal" name="telemovel_aluno" type="tel" />
          </div>
          <div class="field">
            <label for="f-insc">Data de inscrição</label>
            <input class="input" id="f-insc" name="data_inscricao" type="date" />
          </div>
          <div class="field span-2">
            <label for="f-morada">Morada</label>
            <input class="input" id="f-morada" name="morada" />
          </div>
          <div class="field">
            <label for="f-cp">Código postal</label>
            <input class="input" id="f-cp" name="codigo_postal" />
          </div>
          <div class="field">
            <label for="f-loc">Localidade</label>
            <input class="input" id="f-loc" name="localidade" />
          </div>

          <h3 class="form-section span-2">Escola e apoio</h3>
          <div class="field span-2">
            <label for="f-escola">Escola</label>
            <input class="input" id="f-escola" name="escola" />
          </div>
          <div class="field">
            <label for="f-ano">Ano escolar</label>
            <select class="select" id="f-ano" name="ano_escolar"></select>
          </div>
          <div class="field">
            <label for="f-turma">Ano e turma (como no formulário)</label>
            <input class="input" id="f-turma" name="ano_turma" />
          </div>
          <div class="field">
            <label for="f-servico">Serviço</label>
            <select class="select" id="f-servico" name="servico">
              <option value="">—</option>
              <option>Apoio ao Estudo</option>
              <option>Explicação</option>
              <option>Ambos</option>
            </select>
          </div>
          <div class="field span-2">
            <label>Disciplinas no centro</label>
            <div class="chips" id="f-disc"></div>
          </div>
          <div class="field span-2">
            <label for="f-dif">Disciplinas com mais dificuldade</label>
            <textarea class="textarea" id="f-dif" name="dificuldades"></textarea>
          </div>
          <div class="field span-2">
            <label for="f-saude">Saúde, alergias ou restrições alimentares</label>
            <textarea class="textarea" id="f-saude" name="saude"></textarea>
          </div>
          <div class="field span-2">
            <label for="f-como">Como conheceu o ADN Ensinar</label>
            <input class="input" id="f-como" name="como_conheceu" />
          </div>

          <h3 class="form-section span-2">Encarregado de educação</h3>
          <div class="field span-2">
            <label for="f-ee">Nome completo</label>
            <input class="input" id="f-ee" name="encarregado_nome" />
          </div>
          <div class="field">
            <label for="f-tel">Telemóvel</label>
            <input class="input" id="f-tel" name="encarregado_telefone" type="tel" />
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input class="input" id="f-email" name="encarregado_email" type="email" />
          </div>
          <div class="field">
            <label for="f-par">Grau de parentesco</label>
            <input class="input" id="f-par" name="encarregado_parentesco" />
          </div>
          <div class="field">
            <label for="f-prof">Profissão</label>
            <input class="input" id="f-prof" name="encarregado_profissao" />
          </div>

          <h3 class="form-section span-2">Autorizações</h3>
          <label class="check span-2"><input type="checkbox" name="autoriza_credenciais" /> Partilha das credenciais escolares (email e password institucional)</label>
          <label class="check span-2"><input type="checkbox" name="autoriza_imagem" /> Captação e uso de imagem, voz e/ou vídeo para divulgação</label>
          <label class="check span-2"><input type="checkbox" name="autoriza_saida" /> Saída das instalações durante o funcionamento (atividades supervisionadas)</label>
          <label class="check span-2"><input type="checkbox" name="aceita_regulamento" /> Aceitou o Regulamento Interno e as Condições de Inscrição</label>

          <h3 class="form-section span-2">Credenciais escolares</h3>
          <div class="field">
            <label for="f-einst">Email institucional</label>
            <input class="input" id="f-einst" name="email_institucional" type="email" autocomplete="off" />
          </div>
          <div class="field">
            <label for="f-pinst">Password institucional</label>
            <div class="pw">
              <input class="input" id="f-pinst" name="password_institucional" type="password" autocomplete="new-password" />
              <button type="button" class="btn btn--ghost btn--sm" id="pw-toggle">Mostrar</button>
            </div>
          </div>

          <h3 class="form-section span-2 so-financas">Mensalidade</h3>
          <div class="span-2 so-financas">
            <div class="planos" id="planos"></div>
            <button type="button" class="btn btn--ghost btn--sm" id="plano-add">+ Adicionar plano</button>
            <div class="mens-opcoes">
              <div class="field">
                <label for="f-duo" title="O valor de junho é repartido por este n.º de mensalidades. 0 = sem duodécimos.">Meses dos duodécimos</label>
                <input class="input" id="f-duo" name="duodecimo_meses" type="number" min="0" max="12" step="1" />
              </div>
              <div class="field">
                <label for="f-descp">Desconto (%)</label>
                <input class="input" id="f-descp" name="desconto_pct" type="number" min="0" max="100" step="1" />
              </div>
              <div class="field">
                <label for="f-inscv" title="Cobrada uma vez, na 1.ª mensalidade do ano letivo. 0 = sem inscrição.">Inscrição (€)</label>
                <input class="input" id="f-inscv" name="inscricao_valor" type="number" min="0" step="0.01" />
              </div>
            </div>
            <div class="mens-conta" id="plano-resumo"></div>
          </div>

          <h3 class="form-section span-2">Estado e notas</h3>
          <label class="check"><input type="checkbox" name="ativo" checked /> Aluno ativo</label>
          <div class="field">
            <label for="f-desist">Data de desistência</label>
            <input class="input" id="f-desist" name="data_desistencia" type="date" />
          </div>
          <div class="field span-2">
            <label for="f-notas">Notas internas</label>
            <textarea class="textarea" id="f-notas" name="notas"></textarea>
          </div>
          <div class="span-2 small muted" id="f-aulas"></div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--danger so-admin" id="apagar" hidden>Apagar</button>
        <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
        <button type="submit" class="btn" id="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/alunos.js"></script>
</body>
</html>
